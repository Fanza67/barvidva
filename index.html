<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#72242B">
<title>Bar Vidva</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@300;400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
/* Layout: ใบสั่งงานแบบโรงงาน. ขั้นตอน 1-2-3 เรียงตามลำดับจริง, ตัวเลขเป็น mono, ออเดอร์เป็นการ์ดคิวสามช่อง (รอชำระ → กำลังทำ → เสร็จ), รูปที่ยังไม่มีใช้ลายแฮชชิ่งแบบแบบแปลนวิศวกรรม */
:root{
  --bg:#F6F4F3; --surface:#FFFFFF; --surface-2:#EEEAE8; --ink:#1F1A19; --ink-2:#574E4C; --ink-3:#6B615E;
  --line:#DCD5D2; --line-2:#E9E4E1;
  --accent:#72242B; --accent-hover:#5B1C22; --accent-ink:#72242B; --accent-tint:#F5E9EA; --on-accent:#FFFFFF;
  --good:#006664; --good-hover:#004E4C; --good-ink:#006664; --good-tint:#E0EEED; --on-good:#FFFFFF;
  --warn-ink:#80550A; --warn-tint:#F6EACB;
  --chart-a:#72242B; --chart-b:#006664; --chart-grid:#E3DDDA;
  --font-ui:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-display:'Bodoni Moda','Didot','Bodoni 72','Playfair Display',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141011; --surface:#1D1718; --surface-2:#271F20; --ink:#F2EDEB; --ink-2:#BDB1AE; --ink-3:#A0938F;
    --line:#3A2F30; --line-2:#2E2526;
    --accent:#72242B; --accent-hover:#8A2F38; --accent-ink:#E8A3AA; --accent-tint:#33181C; --on-accent:#FFFFFF;
    --good:#006664; --good-hover:#0B7E7B; --good-ink:#6FD0CB; --good-tint:#0F2A29; --on-good:#FFFFFF;
    --warn-ink:#E6BE63; --warn-tint:#33280F;
    --chart-a:#E8A3AA; --chart-b:#4FC4BE; --chart-grid:#33292A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141011; --surface:#1D1718; --surface-2:#271F20; --ink:#F2EDEB; --ink-2:#BDB1AE; --ink-3:#A0938F;
  --line:#3A2F30; --line-2:#2E2526;
  --accent:#72242B; --accent-hover:#8A2F38; --accent-ink:#E8A3AA; --accent-tint:#33181C; --on-accent:#FFFFFF;
  --good:#006664; --good-hover:#0B7E7B; --good-ink:#6FD0CB; --good-tint:#0F2A29; --on-good:#FFFFFF;
  --warn-ink:#E6BE63; --warn-tint:#33280F;
  --chart-a:#E8A3AA; --chart-b:#4FC4BE; --chart-grid:#33292A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
.stripe{height:4px;background:linear-gradient(90deg,var(--accent) 0 50%,var(--good) 50% 100%)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body.hasbar .wrap{padding-bottom:104px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.top{padding-top:18px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wm{font:500 32px/1 var(--font-display);letter-spacing:.01em;color:var(--accent-ink)}
.wm i{font-style:italic}
.sub{font-size:12px;letter-spacing:.06em;color:var(--ink-3)}
.tabs{display:flex;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{flex:1 1 0;min-width:0;min-height:48px;padding:0 4px;white-space:nowrap;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--ink-2);font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.badge{font:500 11px var(--font-mono);padding:1px 7px;border-radius:10px;background:var(--warn-tint);color:var(--warn-ink)}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.btn.good:hover{background:var(--good-hover);border-color:var(--good-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line)}
.btn.warn{color:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
a.btn{text-decoration:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.banner{margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:3px;background:var(--warn-tint);color:var(--ink);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.banner b{color:var(--warn-ink)}
.h1{font:600 22px/1.3 var(--font-ui);margin:4px 0 14px}
.h2{font:600 16px/1.4 var(--font-ui)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:3px;display:flex;flex-direction:column;gap:10px;align-items:center}
/* stepper */
.steps{list-style:none;display:flex;align-items:center;margin:18px 0 12px;padding:0}
.steps li{display:flex;align-items:center;gap:10px;color:var(--ink-3);flex:1 1 auto;min-width:0}
.steps li:last-child{flex:0 0 auto}
.steps li::after{content:"";flex:1;height:1px;background:var(--line);margin:0 10px}
.steps li:last-child::after{display:none}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font:500 13px var(--font-mono)}
.steps li.on{color:var(--ink);font-weight:500}
.steps li.on .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps li.done .n{background:var(--good);border-color:var(--good);color:var(--on-good)}
@media (max-width:520px){.steps .lab{display:none}.steps li.on .lab{display:inline}}
/* order flow */
.flow{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.flow{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.menu{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mcard.off{opacity:.55}
.hatch{background:repeating-linear-gradient(135deg,var(--surface-2) 0 7px,var(--line-2) 7px 8px)}
.ph{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:4/3;max-width:100%;border:0;padding:0;cursor:pointer;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font:500 44px var(--font-display);color:var(--ink-3)}
.soldout{position:absolute;right:8px;top:8px;background:var(--ink);color:var(--bg);font-size:12px;padding:2px 8px;border-radius:3px}
.mb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px 0}
.mb h3{font:600 16px/1.4 var(--font-ui);min-width:0;overflow-wrap:anywhere}
.price{font:500 15px var(--font-mono);white-space:nowrap}
.qty{display:flex;margin:10px 12px 12px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.qty button{width:52px;min-height:46px;border:0;background:var(--surface-2);font:500 20px var(--font-mono);cursor:pointer}
.qty button:hover{background:var(--line-2)}
.qty output{flex:1;display:grid;place-items:center;font:500 18px var(--font-mono);color:var(--ink-3)}
.mcard.on .qty output{color:var(--accent-ink)}
.cart{display:none;position:sticky;top:12px}
@media (min-width:980px){.cart{display:block}}
.cl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cl small{display:block;color:var(--ink-3);font-size:13px}
.cl .mono{white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 12px}
.tot b{font:500 30px/1 var(--font-mono)}
.stack{display:flex;flex-direction:column;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:980px){.bar{display:none}}
.bar .sum{display:flex;flex-direction:column;line-height:1.2}
.bar .sum b{font:500 22px var(--font-mono)}
.ugroup{background:var(--surface);border:1px solid var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
.uhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.unit{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.unit:last-child{border-bottom:0}
.unit .ut{display:flex;justify-content:space-between;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"+";font-family:var(--font-mono);color:var(--ink-3)}
.chip small{font:400 13px var(--font-mono);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"✓";color:var(--accent-ink)}
.pay{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.pay{grid-template-columns:minmax(0,1fr) minmax(0,420px);align-items:start}}
.st{display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border-radius:4px;font-size:13px;font-weight:500;background:var(--warn-tint);color:var(--warn-ink)}
.st.ok{background:var(--good-tint);color:var(--good-ink)}
.st.x{background:var(--surface-2);color:var(--ink-2)}
.qrbox{background:#fff;padding:14px;border:1px solid var(--line);border-radius:3px;width:max-content;max-width:100%;margin:14px auto;display:grid;place-items:center}
.qrbox canvas{display:none!important}
.qrbox img,.qrbox table{display:block;width:240px;height:240px;max-width:100%}
.due{font:500 42px/1 var(--font-mono);text-align:center;margin-top:12px}
.center{text-align:center}
.paybtns{display:grid;gap:10px;margin-top:14px}
.paybtns .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.donev{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:34px 16px}
.donev .okc{width:52px;height:52px;border-radius:50%;background:var(--good);color:var(--on-good);display:grid;place-items:center}
.qno{font:500 64px/1 var(--font-mono);color:var(--accent-ink);letter-spacing:.02em}
/* queue */
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start}
.colh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.colh .cnt{font:500 13px var(--font-mono);color:var(--ink-2)}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
.och{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.och .no{font:500 20px var(--font-mono)}
.ocb{padding:10px 14px}
.ocb ul{list-style:none;margin:0;padding:0}
.ocb li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.ocb li small{display:block;color:var(--ink-3);font-size:13px}
.ocf{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.ocf .btn{flex:1 1 auto}
.amt{font:500 22px var(--font-mono)}
/* dashboard */
.chips.days{margin:4px 0 16px}
.hero{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:820px){.hero{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.big{font:500 40px/1.1 var(--font-mono)}
.big.pos{color:var(--good-ink)} .big.neg{color:var(--accent-ink)}
.prog{height:12px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:var(--good)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px;min-width:0}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .v{font:500 28px/1.2 var(--font-mono);margin:4px 0 2px}
.kpi .s{font-size:12px;color:var(--ink-3)}
.pl{width:100%;border-collapse:collapse}
.pl td,.pl th{padding:9px 0;border-bottom:1px solid var(--line-2);text-align:left;font-weight:400}
.pl td:last-child,.pl th:last-child{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl tr.sum td{font-weight:600;border-bottom:2px solid var(--ink)}
.charts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.cc{min-width:0}
.cch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{min-height:34px;padding:0 12px;border:0;background:var(--surface);color:var(--ink-2);font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vc{display:grid;grid-template-columns:46px minmax(0,1fr);grid-template-rows:180px 24px;column-gap:6px;padding-top:8px}
.vc .y{position:relative;grid-column:1;grid-row:1}
.vc .y span{position:absolute;right:0;transform:translateY(-50%);font:11px var(--font-mono);color:var(--ink-3);white-space:nowrap}
.vc .plot{grid-column:2;grid-row:1;position:relative;border-bottom:1px solid var(--ink-3);background:linear-gradient(var(--chart-grid) 1px,transparent 1px) 0 0/100% 50%}
.vc .cols{position:absolute;inset:0;display:flex;gap:4px;padding:0 2px}
.vc .col{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.vc .col i{display:block;width:100%;max-width:40px;background:var(--chart-a);border-radius:3px 3px 0 0;min-height:0}
.vc .col .v{position:absolute;transform:translateY(-100%);font:500 11px var(--font-mono);padding-bottom:2px;white-space:nowrap}
.vc .xl{grid-column:2;grid-row:2;display:flex;gap:4px;padding:4px 2px 0}
.vc .xl span{flex:1 1 0;min-width:0;text-align:center;font:11px var(--font-mono);color:var(--ink-3)}
.vc .col:hover i,.vc .col:focus-visible i{filter:brightness(1.18)}
.cap{font-size:12px;color:var(--ink-3);margin-top:4px}
.hr{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr .track{height:14px;background:var(--surface-2);border-radius:2px}
.hr .fill{height:100%;background:var(--chart-a);border-radius:0 3px 3px 0}
.hr .val{font:500 13px var(--font-mono);white-space:nowrap}
.lcwrap{width:100%;min-width:0}
svg.lc{display:block}
svg.lc text{font:11px var(--font-mono);fill:var(--ink-3);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:left}
.tbl td.r,.tbl th.r{text-align:right;font-family:var(--font-mono)}
.tblwrap{max-height:260px;overflow:auto}
/* setup */
.sec{margin-top:22px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--ink-2);letter-spacing:.02em}
input[type="text"],input[type="search"],input:not([type]){min-height:44px;width:100%;border:1px solid var(--line);border-radius:2px;padding:0 10px;background:var(--surface);color:var(--ink)}
input.mono{font-family:var(--font-mono)}
.mrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding:14px;border-bottom:1px solid var(--line-2)}
.mrow:last-child{border-bottom:0}
.thumb{width:84px;height:84px;border:1px solid var(--line);border-radius:2px;padding:0;cursor:pointer;position:relative;overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--ink-2)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb span{position:relative;background:var(--surface);padding:2px 6px;border-radius:3px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.fields .wide{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-column:1/-1}
.fcrow{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px;padding:8px 0;align-items:end}
@media (max-width:520px){.fcrow{grid-template-columns:minmax(0,1fr) 110px auto}}
.ppgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.ppgrid{grid-template-columns:minmax(0,1fr) 220px}}
.err{color:var(--accent-ink);font-size:13px}
.foot{margin-top:36px;padding-top:12px;border-top:1px solid var(--line-2);text-align:center;font-size:13px}
.foot a{display:inline-block;padding:10px 14px;color:var(--ink-3);text-decoration:none}
.foot a:hover{color:var(--accent-ink);text-decoration:underline}
body.back .stripe{height:6px;background:var(--ink)}
.botop{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.bolabel{font:500 11px var(--font-mono);letter-spacing:.14em;border:1px solid var(--ink-3);color:var(--ink-2);padding:2px 8px;border-radius:3px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who .id{font:500 13px var(--font-mono);color:var(--ink-2)}
.role{font-size:12px;padding:2px 8px;border-radius:3px;background:var(--surface-2);color:var(--ink-2)}
.login{max-width:420px;margin:32px auto 0}
.login form{display:flex;flex-direction:column;gap:14px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0}

/* ===== v2: ฟอนต์ไทย-อังกฤษเข้าชุดเดียวกัน ไม่เว้นระยะแปลก ===== */
/* เดิมตัวเลข/ปุ่มใช้ฟอนต์ monospace ทำให้ตัวอักษรไทยห่างเท่ากันทุกตัว (เช่นคำว่า "กำหนดเอง")
   ตอนนี้ใช้ฟอนต์เดียวกับตัวหนังสือ แล้วใช้ตัวเลขความกว้างเท่ากัน (tabular) แทน */

/* ===== v3 ===== */
:root{--bg:#FAFAF9;--surface-2:#F3F2ED;--line:#E8E6E1;--line-2:#EFEDE9;--ink:#141010;--ink-2:#5E5755;--ink-3:#756E6B;--r-lg:16px}

/* แถบประกาศบนสุด (เต็มความกว้างจอ) */

/* การ์ดมน เส้นบาง ไม่มีเงา */

/* ตัวเพิ่ม/ลดจำนวน: ปุ่มกลม */

/* แดชบอร์ด: หัวข้อโปร่งขึ้น + แถบมืดสำหรับจุดคุ้มทุน (จุดเด่นของหน้า) */

<body>
<div class="stripe"></div>
<div class="wrap">
  <header class="top" id="top"></header>
  <div id="banner"></div>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="bar" id="bar" hidden></div>
<div id="tip" role="tooltip" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
let LANG='th';try{const l=localStorage.getItem('bv_lang');if(l==='en'||l==='th')LANG=l;}catch(e){}
document.documentElement.lang=LANG;
const locale=()=>LANG==='en'?'en-GB':'th-TH';
const nameOf=(n,ne)=>LANG==='en'&&ne?ne:n;
const descOf=m=>String((LANG==='en'&&m.descEn)?m.descEn:(m.desc||'')).trim();
const tl=l=>(l.t||[]).map((x,i)=>nameOf(x,(l.te||[])[i]));
const imgSrc=s=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(String(s||''))?s:'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const money=n=>(n<0?'−':'')+'฿'+fmt(Math.abs(n));
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hm=iso=>{const d=new Date(iso);return p2(d.getHours())+':'+p2(d.getMinutes());};
const dayLabel=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(locale(),{weekday:'short',day:'numeric',month:'short'});};
const num=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isFinite(x)&&x>0?Math.round(x*100)/100:0;};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const ini=s=>{const a=Array.from(String(s||'').trim());if(!a.length)return '?';return ('เแโใไ'.indexOf(a[0])>=0&&a[1]?a[0]+a[1]:a[0]).toUpperCase();};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};};
const median=a=>{if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};

/* ---------- PromptPay (EMVCo / Thai QR) ---------- */
function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let b=0;b<8;b++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function ppTarget(raw){const d=String(raw||'').replace(/\D/g,'');
  if(/^0\d{9}$/.test(d))return{sub:'01',v:'0066'+d.slice(1)};
  if(d.length===13)return{sub:'02',v:d};
  if(d.length===15)return{sub:'03',v:d};
  return null;}
function ppPayload(raw,amount){const t=ppTarget(raw);if(!t)return null;
  let p=tlv('00','01')+tlv('01',amount>0?'12':'11')+tlv('29',tlv('00','A000000677010111')+tlv(t.sub,t.v))+tlv('58','TH')+tlv('53','764');
  if(amount>0)p+=tlv('54',amount.toFixed(2));
  p+='6304';
  return p+crc16(p);}
function drawQR(el,text){
  if(!el)return;el.innerHTML='';
  if(typeof QRCode==='undefined'){el.innerHTML='<p class="faint" style="max-width:240px;color:#333">สร้าง QR ไม่สำเร็จ (โหลดไลบรารีไม่ได้) ตรวจอินเทอร์เน็ตแล้วโหลดหน้าใหม่</p>';return;}
  try{new QRCode(el,{text:text,width:240,height:240,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}
  catch(e){el.innerHTML='<p class="faint" style="color:#333">สร้าง QR ไม่สำเร็จ</p>';}
}

/* ---------- state ---------- */
const DEFAULT_SETTINGS={ppId:'',ppName:'',fixedCosts:[]};
const S={db:null,uid:null,pub:null,fin:{},loginKind:'staff',cfgMissing:false,sdkMissing:false,authErr:'',permErr:false,wired:false,canWrite:true,isAdmin:false,menu:[],tops:[],settings:null,orders:[],no:{},
  loaded:{menu:false,tops:false,settings:false,orders:false,fin:false},slow:false,dead:false,
  tab:'queue',mode:'front',auth:null,staff:[],staffLoaded:false,shown:false,fails:0,lockUntil:0,loginMsg:'',dashDay:'all',hourMetric:'n',tbl:{},confirm:null,showCancelled:false,lastSig:'',imgTarget:null,busy:false};
const st=()=>S.settings||DEFAULT_SETTINGS;
/* หน่วยที่ขาย (ตั้งค่าได้ในหน้าตั้งค่าร้าน) ภาษาไทย/อังกฤษแยกกัน */
const U=()=>LANG==='en'?(String(st().unitEn||'').trim()||'servings'):(String(st().unit||'').trim()||'ที่');
const freshCart=()=>({qty:{},units:null,step:1,orderId:null,creating:false,skip2:false,sig:'',tip:0,tipMode:'',needHint:false,wish:-1,wishFor:''});
const TIP_MAX=1000,TIP_PRESETS=[5,10,20,50];
const WISHES=['ใครมีแฟนก็ขอให้รักกันนาน\u00a0ๆ ใครโสดก็ขอให้มีแฟนไว\u00a0ๆ','อย่าลอยวิดวะนะครับ','รักดี\u00a0ๆ วิดวะมีให้','คณะไหนมาขอ บอกรอวิดวะ','ชวนวิดวะไปลอยกระทงได้น้าา','วิดวะไม่รักกันแล้วหรออ'];
const payAmt=o=>(+o.total||0)+(+o.tip||0);   /* ยอดที่ต้องชำระจริง = สินค้า + ทิป */
let cart=freshCart();
const menuBy=id=>S.menu.find(m=>m.id===id);
const topBy=id=>S.tops.find(t=>t.id===id);
const allLoaded=()=>S.loaded.menu&&S.loaded.tops&&S.loaded.settings&&S.loaded.orders&&(!S.auth||S.loaded.fin);
const fixedTotal=()=>sum(st().fixedCosts||[],f=>+f.amount||0);

function cartUnits(){return (cart.units||[]).map(u=>{const m=menuBy(u.m);if(!m)return null;
  return{m:m.id,n:m.name,ne:m.nameEn||'',p:+m.price||0,c:+m.cost||0,t:u.t.map(topBy).filter(Boolean).map(t=>({n:t.name,ne:t.nameEn||'',p:+t.price||0,c:+t.cost||0}))};}).filter(Boolean);}
const uTotal=u=>u.p+sum(u.t||[],t=>t.p);
const uCost=u=>u.c+sum(u.t||[],t=>t.c);
function groupUnits(units){const g=new Map();
  units.forEach(u=>{const tn=(u.t||[]).map(t=>t.n);const k=u.n+'|'+tn.slice().sort().join(',');
    const e=g.get(k)||{n:u.n,ne:u.ne||'',t:tn,te:(u.t||[]).map(t=>t.ne||''),q:0,sum:0};e.q++;e.sum+=uTotal(u);g.set(k,e);});
  return Array.from(g.values());}
function cartCount(){return cart.step===1||!cart.units?sum(S.menu,m=>cart.qty[m.id]||0):cartUnits().length;}
function cartTotal(){return cart.step===1||!cart.units?sum(S.menu,m=>(cart.qty[m.id]||0)*(+m.price||0)):sum(cartUnits(),uTotal);}

function recomputeNumbers(){S.no={};   /* เลขคิวมาจากตัวนับบนเซิร์ฟเวอร์ (counters/วันที่) ไม่ได้นับเองในเครื่อง */
  S.orders.forEach(o=>{const n=+o.no||0;S.no[o.id]=!n?'#---':o.sample?'#S'+String(n).padStart(2,'0'):'#'+String(n).padStart(3,'0');});}

/* ---------- toast & tip ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3200);}
const tipEl=$('#tip');
function showTip(txt,x,y){tipEl.textContent=txt;tipEl.hidden=false;const r=tipEl.getBoundingClientRect();let L=x+12,T=y-r.height-12;
  if(L+r.width>innerWidth-8)L=innerWidth-r.width-8;if(L<8)L=8;if(T<8)T=y+18;tipEl.style.left=L+'px';tipEl.style.top=T+'px';}
const hideTip=()=>{tipEl.hidden=true;};

/* ---------- auth + shell (หน้าบ้าน / หลังบ้าน) ---------- */
let resetT=null,lastAct=Date.now(),loginBusy=false,lockTimer=null,ownerWaiter=null;
const BAD='รหัสนิสิตหรือรหัสผ่านไม่ถูกต้อง';
const IDLE_MS=20*60*1000,LOCK_N=5,LOCK_MS=60000,SESSION_H=12;
const BO_TABS=[['queue','คิวออเดอร์'],['dashboard','แดชบอร์ด',1],['setup','ตั้งค่าร้าน',1],['users','ผู้ใช้',1]];   /* 1 = เฉพาะ Core Team */
const ss={get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(k);}catch(e){}}};
const hex=buf=>Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
async function sha(s){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));}
/* รหัสนิสิตและรหัสผ่านกลางถูกแปลงเป็นค่าแฮชก่อนส่ง Firestore; กฎ (firestore.rules) เป็นฝ่ายตรวจ */
const idHash=async id=>'u'+(await sha('bar-vidva|id|'+id)).slice(0,32);
const keyHash=async pw=>sha('bar-vidva|key|'+pw);
const cleanId=v=>String(v||'').replace(/[\s-]/g,'');
const validId=v=>/^\d{8,12}$/.test(v);
const maskId=t=>'••••••'+t;
const whoLabel=a=>a.owner?a.tail:maskId(a.tail);
const SERVER_TS=()=>firebase.firestore.FieldValue.serverTimestamp();

function langSw(){return `<div class="lang" role="group" aria-label="Language"><button type="button" data-act="lang" data-l="th" aria-pressed="${LANG==='th'}">ไทย</button><button type="button" data-act="lang" data-l="en" aria-pressed="${LANG==='en'}">EN</button></div>`;}

  const tabs=S.auth?`<nav class="tabs" role="tablist" aria-label="เมนูสโมวิศวะ">${BO_TABS.filter(t=>!t[2]||S.isAdmin).map(t=>`<button class="tab" role="tab" type="button" data-act="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}${t[0]==='queue'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('')}</nav>`:'';
  top.innerHTML=`<div class="botop"><div class="brand"><span class="wm"><i>Bar</i> Vidva</span><span class="bolabel">${(S.auth?S.isAdmin:S.loginKind==='owner')?'Core Team':'สโมวิดวะ'}</span></div>${who}</div>${tabs}`;
}
function paintBanner(){let h='';
  if(S.mode==='back'&&S.auth&&S.isAdmin&&(S.menu.some(m=>m.sample)||S.tops.some(t=>t.sample)))h+=`<div class="banner"><span><b>เมนูตัวอย่าง</b> ราคาและต้นทุนที่เห็นตอนนี้เป็นข้อมูลตัวอย่าง แก้เป็นของร้านได้ที่ตั้งค่า</span><span class="chips"><button class="btn sm" data-act="tab" data-tab="setup">ไปตั้งค่า</button><button class="btn sm" data-act="clearSampleMenu">ลบเมนูตัวอย่างทั้งหมด</button></span></div>`;
  $('#banner').innerHTML=h;}
function loadingHtml(){
  if(S.sdkMissing)return `<div class="empty"><b>โหลดระบบ Firebase ไม่ได้</b><span>ตรวจอินเทอร์เน็ต แล้วโหลดหน้านี้ใหม่</span></div>`;
  if(S.authErr)return `<div class="empty"><b>เข้าสู่ระบบ Firebase ไม่สำเร็จ</b><span>ตรวจว่าเปิด Anonymous ใน Authentication แล้ว และโดเมนของเว็บอยู่ใน Authorized domains ตามคู่มือ</span><span class="mono faint">${esc(S.authErr)}</span></div>`;
  if(S.permErr)return `<div class="empty"><b>อ่านข้อมูลไม่ได้ (สิทธิ์ถูกปฏิเสธ)</b><span>ยังไม่ได้เผยแพร่กฎ Firestore Rules หรือกฎไม่ตรงกับแอป ดูหัวข้อเผยแพร่กฎความปลอดภัยในคู่มือ</span></div>`;
  return `<div class="empty">${S.slow?'<b>ยังเชื่อมต่อฐานข้อมูลไม่ได้</b><span>ตรวจอินเทอร์เน็ต แล้วรอสักครู่ ข้อมูลจะโหลดเองเมื่อเชื่อมต่อได้</span>':'กำลังโหลดเมนูและออเดอร์…'}</div>`;}
function noConfigHtml(){return `<section class="panel login"><h1 class="h1" style="margin-top:0">ยังไม่ได้ตั้งค่า Firebase</h1><p class="muted">เปิดไฟล์ <b class="mono">firebase-config.js</b> แล้ววางค่าจาก Firebase Console แทนข้อความ <span class="mono">PASTE_HERE</span> จากนั้นอัปโหลดเว็บใหม่ (ดูขั้นตอนในคู่มือ)</p></section>`;}
function render(){
  paintTop();paintBanner();
  const v=$('#view');let bar=false;
  if(S.cfgMissing){v.innerHTML=noConfigHtml();}
  else if(S.mode==='back'){
    if(!S.auth){if(S.sdkMissing||S.authErr||S.permErr)v.innerHTML=loadingHtml();else if(!$('#lgForm')&&!$('#ownForm'))renderLogin();}
    else if(!allLoaded())v.innerHTML=loadingHtml();
    else if((S.tab==='setup'||S.tab==='users'||S.tab==='dashboard')&&!S.isAdmin)v.innerHTML=`<div class="empty"><b>ส่วนนี้สำหรับ Core Team</b><span>แดชบอร์ด ตั้งค่าเมนู ราคา พร้อมเพย์ และผู้ใช้ ต้องเข้าด้วยบัญชี Core Team</span></div>`;
    else if(S.tab==='queue')renderQueue();
    else if(S.tab==='dashboard')renderDash();
    else if(S.tab==='setup')renderSetup();
    else if(S.tab==='users')renderUsers();
  }else{
    if(!allLoaded())v.innerHTML=loadingHtml();
    else{renderFlow();bar=cart.step<=3;}
  }
  $('#bar').hidden=!bar;document.body.classList.toggle('hasbar',bar);
}

    <form id="lgForm" novalidate>
      <label class="field"><span>รหัสนิสิต</span><input id="lgId" class="mono" type="text" inputmode="numeric" autocomplete="username" maxlength="14"></label>
      <div class="field"><span id="lgPwL">รหัสผ่าน</span><div class="pwrow"><input id="lgPw" type="password" aria-labelledby="lgPwL" autocomplete="current-password"><button class="btn" type="button" data-act="showPw">แสดง</button></div></div>

function setMsg(t,bad){const m=$('#lgMsg');if(m){m.textContent=t;m.className='msg'+(bad?' bad':'');}}
function paintLock(){
  clearInterval(lockTimer);
  const f=()=>{const b=$('#lgBtn');if(!b||!$('#lgForm')){clearInterval(lockTimer);return;}
    const left=Math.ceil((S.lockUntil-Date.now())/1000);
    if(left>0){b.disabled=true;b.textContent='ลองใหม่ได้ใน '+left+' วินาที';}
    else{if(!loginBusy)b.disabled=false;b.textContent='เข้าสู่ระบบ';clearInterval(lockTimer);}};
  if(S.lockUntil>Date.now()&&$('#lgForm')){f();lockTimer=setInterval(f,500);}}
async function submitLogin(owner){
  if(loginBusy)return;loginBusy=true;
  const btn=$('#lgBtn');if(btn)btn.disabled=true;setMsg('กำลังตรวจสอบ…',false);
  let r;
  try{r=owner?await ownerLogin($('#ownEmail')?$('#ownEmail').value:'',$('#ownPw')?$('#ownPw').value:''):await doLogin($('#lgId')?$('#lgId').value:'',$('#lgPw')?$('#lgPw').value:'');}
  catch(e){r={err:'เชื่อมต่อไม่ได้ ลองอีกครั้ง'};}
  loginBusy=false;
  if(r.ok)return;
  const b2=$('#lgBtn');if(b2)b2.disabled=false;
  setMsg(r.err,true);const p=$('#lgPw')||$('#ownPw');if(p)p.value='';paintLock();}
/* พนักงาน: เขียนเอกสาร sessions/{uid}; กฎฝั่งเซิร์ฟเวอร์จะอนุญาตเมื่อรหัสผ่านกลางถูกและรหัสนิสิตอยู่ในรายชื่อเท่านั้น */
async function doLogin(idRaw,pw){
  const id=cleanId(idRaw);
  if(Date.now()<S.lockUntil)return{err:'ใส่ผิดหลายครั้งแล้ว รออีก '+Math.ceil((S.lockUntil-Date.now())/1000)+' วินาที'};
  if(!S.db||!S.uid)return{err:'ยังเชื่อมต่อระบบไม่ได้ รอสักครู่แล้วลองใหม่'};
  if(!validId(id))return{err:'ใส่รหัสนิสิตเป็นตัวเลข'};
  if(!pw)return{err:'ใส่รหัสผ่าน'};
  const bump=()=>{S.fails=(S.fails||0)+1;if(S.fails>=LOCK_N){S.lockUntil=Date.now()+LOCK_MS;S.fails=0;}ss.set('bv_lock',JSON.stringify({f:S.fails,u:S.lockUntil}));};
  let h,k;
  try{h=await idHash(id);k=await keyHash(pw);}
  catch(e){return{err:e&&e.message==='nocrypto'?'เบราว์เซอร์นี้ตรวจรหัสผ่านไม่ได้ ลองเปิดด้วยเบราว์เซอร์อื่น':'เชื่อมต่อไม่ได้ ลองอีกครั้ง'};}
  try{await S.db.doc('sessions/'+S.uid).set({h:h,k:k,t:id.slice(-4),at:SERVER_TS()});}
  catch(e){
    if(e&&e.code==='permission-denied'){bump();return{err:BAD};}
    return{err:'เชื่อมต่อไม่ได้ ลองอีกครั้ง'};}
  S.fails=0;ss.del('bv_lock');
  startSession({h:h,tail:id.slice(-4)});
  return{ok:true};}
/* Core Team: Firebase Authentication (อีเมล+รหัสผ่าน) แล้วให้เซิร์ฟเวอร์ยืนยันว่า UID อยู่ในกฎ */
const AUTH_ERR={
  'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/wrong-password':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง',
  'auth/too-many-requests':'ลองผิดหลายครั้ง ระบบพักไว้ชั่วคราว รอสักครู่แล้วลองใหม่','auth/network-request-failed':'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่','auth/operation-not-allowed':'ยังไม่ได้เปิดการเข้าสู่ระบบด้วยอีเมลใน Firebase Authentication'};
function ownerLogin(email,pw){
  return new Promise(resolve=>{
    email=String(email||'').trim();
    if(!S.db||!S.uid){resolve({err:'ยังเชื่อมต่อระบบไม่ได้ รอสักครู่แล้วลองใหม่'});return;}
    if(!email||!pw){resolve({err:'ใส่อีเมลและรหัสผ่าน'});return;}
    ownerWaiter=resolve;
    setTimeout(()=>{if(ownerWaiter===resolve){ownerWaiter=null;resolve({err:'เชื่อมต่อไม่ได้ ลองอีกครั้ง'});}},20000);
    firebase.auth().signInWithEmailAndPassword(email,pw).catch(e=>{
      if(ownerWaiter===resolve){ownerWaiter=null;resolve({err:AUTH_ERR[e&&e.code]||'เข้าสู่ระบบไม่สำเร็จ ('+((e&&e.code)||'error')+')'});}});
  });}
async function becomeOwner(u){
  try{await S.db.collection('staff').limit(1).get();}   /* อ่านได้เฉพาะ Core Team (ตรวจที่เซิร์ฟเวอร์) */
  catch(e){if(e&&e.code==='permission-denied')return false;throw e;}
  S.isAdmin=true;S.auth={owner:true,tail:u.email||'owner',h:null};return true;}
async function probeSession(){
  try{
    const d=await S.db.doc('sessions/'+S.uid).get();
    if(!d.exists)return;
    const x=d.data(),at=x.at&&x.at.toMillis?x.at.toMillis():0;
    if(!at||Date.now()-at>SESSION_H*3600e3)return;
    await S.db.doc('finance/main').get();   /* ยืนยันสิทธิ์พนักงานกับเซิร์ฟเวอร์อีกครั้ง */
    S.auth={h:x.h,tail:x.t};lastAct=Date.now();
  }catch(e){}}
function startSession(a){
  S.auth=a;lastAct=Date.now();
  S.tab=parseHash().tab||'queue';if(!S.isAdmin&&S.tab!=='queue')S.tab='queue';
  try{history.replaceState(null,'','#backoffice-'+S.tab);}catch(e){}
  ensureOrders();ensureFinanceSub();ensureStaffSub();render();}
async function logout(msg){
  const was=S.auth;S.auth=null;S.isAdmin=false;S.confirm=null;S.loginMsg=msg||'';S.loginKind='staff';
  ensureOrders();ensureFinanceSub();ensureStaffSub();
  const v=$('#view');if(v)v.innerHTML='';
  try{if(S.mode==='back')history.replaceState(null,'','#backoffice');}catch(e){}
  render();
  try{
    if(was&&was.owner)await firebase.auth().signOut();
    else if(S.uid)await S.db.doc('sessions/'+S.uid).delete();
  }catch(e){}}
async function recheckAuth(){
  if(!S.auth||S.auth.owner||!S.db)return;
  try{await S.db.doc('finance/main').get();}
  catch(e){if(e&&e.code==='permission-denied')logout('สิทธิ์ของบัญชีนี้ถูกยกเลิกแล้ว');}}

/* ---------- order flow ---------- */
function stepper(done){const L=['เมนู','ซอส','ชำระเงิน'],cs=Math.min(cart.step,3);   /* ทิปอยู่ในขั้น "ชำระเงิน" ลูกค้าไม่เห็นเป็นขั้นแยก */
  return `<ol class="steps" aria-label="ขั้นตอนการสั่ง">`+L.map((l,i)=>{const n=i+1;const c=done||n<cs?'done':n===cs?'on':'';
    return `<li class="${c}"${n===cs&&!done?' aria-current="step"':''}><span class="n">${done||n<cs?'✓':n}</span><span class="lab">${l}</span></li>`;}).join('')+`</ol>`;}
function menuCard(m){const q=cart.qty[m.id]||0,off=m.available===false;
  const img=m.img?`<img src="${esc(m.img)}" alt="" loading="lazy" data-fb="1">`:`<span class="ini">${esc(ini(nameOf(m.name,m.nameEn)))}</span>`;
  return `<article class="mcard${q?' on':''}${off?' off':''}" data-id="${m.id}">
    <button class="ph hatch" type="button" data-act="inc" data-id="${m.id}" aria-label="เพิ่ม ${esc(nameOf(m.name,m.nameEn))}"${off?' disabled':''}>${img}${off?'<span class="soldout">หมด</span>':''}</button>
    <div class="mb"><h3>${esc(nameOf(m.name,m.nameEn))}</h3><span class="price">${money(m.price)}</span></div>${descOf(m)?`<p class="mdesc">${esc(descOf(m))}</p>`:''}
    <div class="qty"><button type="button" data-act="dec" data-id="${m.id}" aria-label="ลด ${esc(nameOf(m.name,m.nameEn))}"${off?' disabled':''}>−</button><output>${q}</output><button type="button" data-act="inc" data-id="${m.id}" aria-label="เพิ่ม ${esc(nameOf(m.name,m.nameEn))}"${off?' disabled':''}>+</button></div>
  </article>`;}
function renderFlow(){const v=$('#view');
  if(cart.step===1){
    const menu=S.menu.length?`<div class="menu">${S.menu.map(menuCard).join('')}</div>`:`<div class="empty"><b>ร้านยังไม่เปิดรับออเดอร์</b><span>เรียกพนักงานได้เลย</span></div>`;
    v.innerHTML=stepper()+`<div class="hero1"><h1 class="h1">เลือกเมนูและจำนวน</h1><p>แตะรูปหรือปุ่ม + เพื่อเลือกเมนู จากนั้นเลือกซอสและชำระเงินได้เลยค้าบ</p></div><div class="flow"><section>${menu}</section><aside class="cart panel" id="cartAside"></aside></div>`;
    paintCart();
  }else if(cart.step===2){renderToppings();}
  else if(cart.step===3)renderTip();
  else renderCheckout();
}
function cartLines(){
  if(cart.step===1)return S.menu.filter(m=>cart.qty[m.id]>0).map(m=>({n:m.name,ne:m.nameEn||'',q:cart.qty[m.id],sum:m.price*cart.qty[m.id],t:[]}));
  return groupUnits(cartUnits());}
function paintCart(){
  const count=cartCount(),items=cartTotal(),lines=cartLines(),tip=cart.step===3?(+cart.tip||0):0,total=items+tip;
  const nextLabel=cart.step===1?'ถัดไป: ซอส':cart.step===2?'ถัดไป: ชำระเงิน':'ถัดไป: ชำระเงิน';
  const btns=cart.step===1
    ?`<button class="btn primary" data-act="next"${count?'':' disabled'}>${nextLabel} →</button>${count?'<button class="btn ghost" data-act="clear">ล้างทั้งหมด</button>':''}`
    :`<button class="btn primary" data-act="next">${nextLabel} →</button><button class="btn ghost" data-act="back">${cart.step===3?'← กลับ':'← แก้เมนู'}</button>`;
  const body=lines.length?lines.map(l=>`<div class="cl"><span>${esc(nameOf(l.n,l.ne))} ×${l.q}${l.t&&l.t.length?`<small>+ ${esc(tl(l).join(', '))}</small>`:''}</span><span class="mono">${money(l.sum)}</span></div>`).join(''):`<p class="faint" style="padding:6px 0">ยังไม่ได้เลือกเมนู แตะรูปหรือปุ่ม + เพื่อเพิ่ม</p>`;

function breakevenPoints(){const paid=S.orders.filter(o=>o.status==='paid').slice().sort((a,b)=>(a.paidAt||a.createdAt)<(b.paidAt||b.createdAt)?-1:1);

const LC={pts:[]};
function drawLine(){const host=$('#lcHost');if(!host)return;
  const pts=breakevenPoints(),F=fixedTotal();LC.pts=[];
  if(!pts.length){host.innerHTML='<p class="faint">ยังไม่มีออเดอร์ที่รับเงินแล้ว</p>';return;}
  const W=Math.max(260,host.clientWidth||320),H=250,ml=56,mr=14,mt=14,mb=28;
  const t0=pts[0].t;let t1=pts[pts.length-1].t;if(t1<=t0)t1=t0+3600e3;
  const ys=pts.map(p=>p.y);const ymin=Math.min(0,Math.min.apply(null,ys)),ymax0=Math.max(F,Math.max.apply(null,ys),1);
  const step=niceStep(ymax0-ymin,4),ymaxT=Math.ceil(ymax0/step)*step,yminT=Math.floor(ymin/step)*step;
  const X=t=>ml+(t-t0)/(t1-t0)*(W-ml-mr),Y=y=>mt+(1-(y-yminT)/(ymaxT-yminT))*(H-mt-mb);
  let grid='';for(let v=yminT;v<=ymaxT+1e-9;v+=step)grid+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--chart-grid)"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const multi=ymd(new Date(t0))!==ymd(new Date(t1));let xl='';
  for(let i=0;i<4;i++){const t=t0+(t1-t0)*i/3,d=new Date(t);xl+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${multi?p2(d.getDate())+'/'+p2(d.getMonth()+1)+' ':''}${hm(d.toISOString())}</text>`;}
  let path=`M${X(pts[0].t)} ${Y(0)} V${Y(pts[0].y)}`;pts.forEach((p,i)=>{if(i)path+=` H${X(p.t)} V${Y(p.y)}`;});
  LC.pts=pts.map(p=>({px:X(p.t),py:Y(p.y),p}));
  const last=pts[pts.length-1],ly=Y(last.y),fy=Y(F);

  const below=F&&Math.abs(ly-fy)<20&&ly<=fy;
  const endl=`<text x="${W-mr}" y="${below?ly+16:ly-8}" text-anchor="end" style="fill:var(--good-ink);font-weight:500">${money(last.y)}</text>`;
  host.innerHTML=`<svg class="lc" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="กำไรขั้นต้นสะสมล่าสุด ${money(last.y)}${F?` เทียบต้นทุนคงที่ ${money(F)}`:''}">${grid}${xl}${thr}<path d="${path}" fill="none" stroke="var(--chart-b)" stroke-width="2.5" stroke-linejoin="round"/>${endl}<g id="lcx" style="display:none"><line y1="${mt}" y2="${H-mb}" stroke="var(--ink-3)" stroke-width="1"/><circle r="5" fill="var(--chart-b)" stroke="var(--surface)" stroke-width="2"/></g></svg>`;}

async function downscale(file,max,quality){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',quality));
  }finally{URL.revokeObjectURL(url);}}
async function uploadImg(id,file){
  toast('กำลังอัปโหลดรูป…');
  try{const blob=await downscale(file,640,.78);   /* เก็บเป็นรูปเล็กในฐานข้อมูลโดยตรง ไม่ต้องใช้ Storage (ฟรี) */
    const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});
    if(url.length>700000)throw new Error('big');
    await S.db.collection('menu').doc(id).update({img:url,sample:false});toast('อัปโหลดรูปแล้ว');}
  catch(e){toast('อัปโหลดรูปไม่สำเร็จ ลองรูปที่เล็กลงหรือเป็น JPG/PNG');}}

  if(!toks.length){toast('ใส่รหัสนิสิตก่อน');return;}
  const bad=toks.filter(t=>!validId(t));
  if(bad.length){toast('รหัสนี้ไม่ใช่ตัวเลข 8–12 หลัก: '+bad.slice(0,3).join(', '));return;}
  const good=Array.from(new Set(toks));let n=0;
  for(const id of good){try{const h=await idHash(id);await S.db.doc('staff/'+h).set({tail:id.slice(-4),note:note,addedAt:new Date().toISOString()});n++;}catch(e){break;}}
  toast(n===good.length?'เพิ่มแล้ว '+n+' คน':'เพิ่มได้ '+n+' จาก '+good.length+' คน');
  if(n){ta.value='';nt.value='';}}

/* ---------- routing: หน้าบ้านที่ลิงก์หลัก, หลังบ้านที่ #backoffice ---------- */
function parseHash(){const h=location.hash.replace('#','');
  if(h==='backoffice'||h.indexOf('backoffice-')===0){const t=h.slice(11);return{mode:'back',tab:['queue','dashboard','setup','users'].includes(t)?t:null};}
  return{mode:'front',tab:null};}
function route(){
  const p=parseHash();
  S.mode=p.mode;if(p.tab)S.tab=p.tab;
  S.confirm=null;
  if(p.mode==='front'&&S.auth){logout();scrollTo(0,0);return;}
  ensureOrders();ensureFinanceSub();ensureStaffSub();render();scrollTo(0,0);}

/* ---------- Firebase: เริ่มระบบและจัดการสถานะผู้ใช้ ---------- */
function fbConfigOk(c){return !!(c&&c.apiKey&&c.projectId&&!/PASTE/i.test(String(c.apiKey)+String(c.projectId)));}
function onUser(u){
  if(!u){firebase.auth().signInAnonymously().catch(e=>{S.authErr=(e&&e.code)||'error';S.slow=true;render();});return;}
  (async()=>{
    S.uid=u.uid;S.authErr='';
    if(!u.isAnonymous){
      /* บัญชีอีเมล: ใช้เฉพาะหลังบ้าน และต้องผ่านการตรวจสิทธิ์ Core Team จากเซิร์ฟเวอร์ */
      if(S.mode!=='back'){try{await firebase.auth().signOut();}catch(e){}return;}
      let ok=false,fail=false;
      try{ok=await becomeOwner(u);}catch(e){fail=true;}
      const w=ownerWaiter;ownerWaiter=null;
      if(!ok){
        S.loginMsg=fail?'เชื่อมต่อไม่ได้ ลองอีกครั้ง':'บัญชีนี้ไม่ใช่ Core Team (ยังไม่ได้ใส่ UID ในกฎ Firestore)';S.loginKind='owner';
        if(w)w({err:S.loginMsg});
        try{await firebase.auth().signOut();}catch(e){}
        return;}
      if(w)w({ok:true});
      if(!S.wired){S.wired=true;wire();}
      startSession(S.auth);return;}
    if(S.mode==='back'&&!S.auth)await probeSession();
    if(!S.wired){S.wired=true;wire();}
    ensureOrders();ensureFinanceSub();ensureStaffSub();render();
  })();}
async function boot(){
  const p=parseHash();S.mode=p.mode;if(p.tab)S.tab=p.tab;
  try{const raw=ss.get('bv_lock');if(raw){const l=JSON.parse(raw);S.fails=+l.f||0;S.lockUntil=+l.u||0;}}catch(e){}
  if(!window.firebase||!firebase.auth||!firebase.firestore){S.sdkMissing=true;render();return;}
  if(!fbConfigOk(window.FIREBASE_CONFIG)){S.cfgMissing=true;render();return;}
  render();
  firebase.initializeApp(window.FIREBASE_CONFIG);
  S.db=firebase.firestore();
  try{S.db.settings({experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true});}catch(e){}
  const auth=firebase.auth();
  try{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);}catch(e){}   /* ปิดแท็บ = ออกจากระบบ */
  window.addEventListener('hashchange',route);
  auth.onAuthStateChanged(onUser);
  setInterval(()=>{ensureOrders();if(S.mode==='back'&&S.auth&&S.tab==='queue'&&allLoaded()&&!S.confirm)renderQueue();},30000);
  setInterval(recheckAuth,300000);
  setInterval(()=>{
    const idle=Date.now()-lastAct;
    if(S.auth&&idle>IDLE_MS){logout('ออกจากระบบอัตโนมัติเพราะไม่มีการใช้งานนาน');return;}
    if(S.mode==='front'&&allLoaded()&&cart.step<4&&(cartCount()>0||cart.step>=2)&&idle>180000){cart=freshCart();render();toast('เริ่มออเดอร์ใหม่เพราะไม่มีการใช้งานสักพัก');}
  },5000);
}

/* ช่องกรอกทิปเอง: ตัวเลขจำนวนเต็ม 0–TIP_MAX อัปเดตยอดรวมทันทีโดยไม่วาดช่องกรอกใหม่ (โฟกัสไม่หลุด) */

function trLine(s){
  if(!THAI.test(s))return s;
  const lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0];let core=s.trim(),suf='';
  if(/\s→$/.test(core)){suf=' →';core=core.slice(0,-2).trim();}
  let r=EN[core];
  if(r===undefined){for(let i=0;i<RE.length;i++){const m=RE[i][0].exec(core);if(m){r=RE[i][1].apply(null,m.slice(1));break;}}}
  if(r===undefined&&core.indexOf(' · ')>0)r=core.split(' · ').map(trLine).join(' · ');
  return lead+(r===undefined?core:r)+suf+trail;}
function tr(s){return(LANG!=='en'||!THAI.test(s))?s:String(s).split('\n').map(trLine).join('\n');}
const TR_ATTRS=['placeholder','aria-label','title','alt'];
function trAttrs(el){if(!el.getAttribute)return;TR_ATTRS.forEach(a=>{const v=el.getAttribute(a);if(v&&THAI.test(v)){const t=tr(v);if(t!==v)el.setAttribute(a,t);}});}
function trNode(n){
  if(n.nodeType===3){const v=n.nodeValue;if(THAI.test(v)){const t=tr(v);if(t!==v)n.nodeValue=t;}return;}
  if(n.nodeType!==1)return;
  const tg=n.tagName;if(tg==='SCRIPT'||tg==='STYLE')return;
  trAttrs(n);if(tg==='TEXTAREA')return;
  for(let c=n.firstChild;c;c=c.nextSibling)trNode(c);}
new MutationObserver(ms=>{
  if(LANG!=='en')return;
  for(const m of ms){
    if(m.type==='characterData')trNode(m.target);
    else if(m.type==='attributes')trAttrs(m.target);
    else m.addedNodes.forEach(trNode);}
}).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTRS});

/* กดสองทีเพื่อยืนยัน: ทีแรกปุ่มเปลี่ยนเป็น "แตะอีกครั้งเพื่อยืนยัน" ทีสองภายใน 4 วินาทีจึงทำงานจริง */
const ARM_MS=4000;
const armKey=el=>el.dataset.act+'|'+el.dataset.id+'|'+(el.dataset.m||'');
function armOn(el){if(!el.dataset.lb)el.dataset.lb=el.textContent;el.classList.add('armed');el.textContent='แตะอีกครั้งเพื่อยืนยัน';el.setAttribute('aria-live','polite');}
function armOff(el){el.classList.remove('armed');if(el.dataset.lb){el.textContent=el.dataset.lb;delete el.dataset.lb;}el.removeAttribute('aria-live');}
function armClear(){S.arm=null;clearTimeout(armClear.t);$$('[data-t2].armed').forEach(armOff);}
function paintArm(){if(!S.arm)return;$$('[data-t2]').forEach(b=>{if(armKey(b)===S.arm.k)armOn(b);});}
function tap2(el){
  const k=armKey(el);
  if(S.arm&&S.arm.k===k&&Date.now()-S.arm.t<ARM_MS){armClear();return true;}
  armClear();S.arm={k,t:Date.now()};armOn(el);
  armClear.t=setTimeout(()=>{if(S.arm&&S.arm.k===k)armClear();},ARM_MS);
  return false;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled){if(el.dataset.t2&&!tap2(el))return;act(el.dataset.act,el);}});
document.addEventListener('input',onField);
document.addEventListener('change',onChange);
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.fb){t.remove();}},true);
document.addEventListener('pointermove',e=>{
  const svg=e.target.closest&&e.target.closest('svg.lc');
  if(svg&&LC.pts.length){const r=svg.getBoundingClientRect(),x=e.clientX-r.left;let b=LC.pts[0];LC.pts.forEach(p=>{if(Math.abs(p.px-x)<Math.abs(b.px-x))b=p;});
    const g=$('#lcx',svg);g.style.display='';$('line',g).setAttribute('x1',b.px);$('line',g).setAttribute('x2',b.px);$('circle',g).setAttribute('cx',b.px);$('circle',g).setAttribute('cy',b.py);
    showTip(`${b.p.d} ${hm(new Date(b.p.t).toISOString())}\nกำไรขั้นต้นสะสม ${money(b.p.y)}${b.p.no?'\nหลังออเดอร์ '+b.p.no:''}`,e.clientX,e.clientY);return;}
  const g=$('#lcx');if(g)g.style.display='none';
  const t=e.target.closest&&e.target.closest('[data-tip]');
  if(t)showTip(t.getAttribute('data-tip'),e.clientX,e.clientY);else hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t){const r=t.getBoundingClientRect();showTip(t.getAttribute('data-tip'),r.left+r.width/2,r.top);}});
document.addEventListener('focusout',hideTip);

boot();
